<!doctype html>
<html lang="da">
<title>Davids Spil</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: a toy-box menu with one big tappable card per game, matching the cream-and-ink look of the games.
   Deliberately one light look in every theme, so all colors are set explicitly. */
:root {
  --sky: #bfe6ff;
  --cream: #fff8e6;
  --ink: #2b2340;
  --gold: #ffd23f;
  --red: #e63b2e;
  --purple: #7a4fc9;
  --grass: #8fd16a;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--sky); color: var(--ink); }
body {
  font-family: 'Baloo 2', system-ui, sans-serif;
  min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: clamp(20px, 4vh, 40px);
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(var(--sky) 0 70%, var(--grass) 70%);
}
h1 {
  margin: 0; text-align: center; line-height: 1;
  font-size: clamp(2.4rem, 8vw, 4.2rem); font-weight: 800;
  padding: 10px 28px 6px;
  background: var(--cream); border: 4px solid var(--ink); border-radius: 24px;
  box-shadow: 0 6px 0 var(--ink);
}
.games {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: clamp(16px, 3vw, 32px); width: 100%; max-width: 760px;
}
.game {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 22px 16px 18px;
  color: var(--cream); text-decoration: none; text-align: center;
  border: 4px solid var(--ink); border-radius: 28px;
  box-shadow: 0 8px 0 var(--ink);
  transition: transform 0.08s, box-shadow 0.08s;
  -webkit-tap-highlight-color: transparent;
}
.game:hover { transform: translateY(-3px) rotate(-1deg); box-shadow: 0 11px 0 var(--ink); }
.game:active { transform: translateY(8px); box-shadow: 0 0 0 var(--ink); }
.game:focus-visible { outline: 5px solid var(--gold); outline-offset: 4px; }
.fire { background: var(--red); }
.lorry { background: var(--purple); }
.icon {
  font-size: clamp(5rem, 16vw, 7.5rem); line-height: 1.1;
  filter: drop-shadow(0 4px 0 rgba(43, 35, 64, 0.35));
}
.game:hover .icon { animation: wiggle 0.6s ease; }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
.name { font-size: clamp(1.7rem, 5vw, 2.3rem); font-weight: 800; line-height: 1.05; }
.what { font-size: 1.15rem; font-weight: 600; line-height: 1.2; opacity: 0.95; text-wrap: balance; }
@media (prefers-reduced-motion: reduce) { .game, .game:hover .icon { transition: none; animation: none; } }
</style>
<body>
  <h1>Davids Spil</h1>
  <main class="games">
    <a class="game fire" href="firetruck/">
      <span class="icon" aria-hidden="true">🚒</span>
      <span class="name">Brandbilen</span>
      <span class="what">Sluk brandene i byen!</span>
    </a>
    <a class="game lorry" href="lorry/">
      <span class="icon" aria-hidden="true">🚚</span>
      <span class="name">Lastbilen</span>
      <span class="what">Kør kasser ud til butikkerne!</span>
    </a>
  </main>
</body>
</html>
