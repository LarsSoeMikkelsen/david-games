<!doctype html>
<html lang="da">
<title>Davids Brandbil</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: one full-screen toy board. A chunky cream top bar sits over a top-down city canvas. */
:root {
  --sky: #bfe6ff;
  --cream: #fff8e6;
  --ink: #2b2340;
  --truck: #e8352b;
  --truck-dark: #b8231b;
  --gold: #ffc21a;
  --display: "Baloo 2", "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; touch-action: manipulation; background: var(--sky); color: var(--ink); }
body { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }

#app {
  /* dvh = the area actually visible between the phone browser's toolbars; vh is the fallback. */
  position: fixed; top: 0; left: 0; width: 100%; height: 100vh; height: 100dvh;
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--sky);
  font-family: var(--display);
}

header {
  display: flex; align-items: center; gap: 12px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--cream);
  border-bottom: 4px solid var(--ink);
}
h1 {
  margin: 0; flex: 1; min-width: 0;
  font-size: clamp(1.3rem, 3.2vw, 2rem); font-weight: 800; line-height: 1;
  color: var(--truck); text-wrap: balance; text-align: center;
  letter-spacing: 0.01em;
}
.stars {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 16px 4px 10px;
  background: var(--gold); border: 3px solid var(--ink); border-radius: 999px;
  box-shadow: 0 4px 0 var(--ink);
  font-size: 1.9rem; font-weight: 800; line-height: 1;
  font-variant-numeric: tabular-nums;
}
.stars svg { width: 34px; height: 34px; }
.stars.bump, .avatar.bump { animation: bump 0.5s ease; }
.avatar {
  width: 58px; height: 58px; flex: none;
  border-radius: 50%; border: 3px solid var(--ink);
  box-shadow: 0 4px 0 var(--ink);
  background: var(--gold);
  display: grid; place-items: center;
  font-size: 34px; line-height: 1;
}
.banner { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.banner-emoji { font-size: clamp(4rem, 14vw, 7rem); line-height: 1; }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.3) rotate(-6deg); } 100% { transform: scale(1); } }

.actions { display: flex; gap: 10px; align-items: center; }
button {
  font: inherit; color: var(--ink); cursor: pointer;
  border: 3px solid var(--ink); border-radius: 999px;
  box-shadow: 0 4px 0 var(--ink);
  transition: transform 0.08s, box-shadow 0.08s;
}
button:active { transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
button:focus-visible { outline: 4px solid var(--truck); outline-offset: 3px; }
.honk {
  background: var(--truck); color: var(--cream);
  font-size: 1.5rem; font-weight: 800; line-height: 1;
  padding: 10px 22px;
}
.sound { background: var(--cream); width: 52px; height: 52px; display: grid; place-items: center; padding: 0; }
.sound svg { width: 28px; height: 28px; }
.home { background: var(--cream); width: 52px; height: 52px; display: grid; place-items: center; padding: 0;
  color: var(--ink); text-decoration: none; cursor: pointer;
  border: 3px solid var(--ink); border-radius: 999px; box-shadow: 0 4px 0 var(--ink);
  transition: transform 0.08s, box-shadow 0.08s; }
.home:active { transform: translateY(4px); box-shadow: 0 0 0 var(--ink); }
.home:focus-visible { outline: 4px solid var(--cab); outline-offset: 3px; }
.home svg { width: 28px; height: 28px; }

#board { position: relative; flex: 1; min-height: 0; background: #8fd16a; }
#city { position: absolute; inset: 0; display: block; touch-action: none; }

.hint {
  position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
  max-width: calc(100% - 32px); width: max-content;
  padding: 8px 20px;
  background: var(--cream); border: 3px solid var(--ink); border-radius: 18px;
  box-shadow: 0 4px 0 var(--ink);
  font-size: clamp(1.1rem, 3vw, 1.5rem); font-weight: 800; text-align: center;
  pointer-events: none;
  animation: float 1.6s ease-in-out infinite;
}
@keyframes float { 50% { transform: translate(-50%, -6px); } }

.banner {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: max-content; max-width: calc(100% - 32px);
  padding: 12px 28px;
  background: var(--gold); border: 4px solid var(--ink); border-radius: 24px;
  box-shadow: 0 6px 0 var(--ink);
  font-size: clamp(1.8rem, 6vw, 3.4rem); font-weight: 800; line-height: 1.1; text-align: center;
  pointer-events: none;
  animation: pop 0.5s cubic-bezier(.3,1.6,.5,1);
}
@keyframes pop { from { transform: translate(-50%, -50%) scale(0.2); } to { transform: translate(-50%, -50%) scale(1); } }

@media (max-width: 560px) {
  header { gap: 8px; justify-content: space-between; }
  h1 { display: none; }
  .home { width: 44px; height: 44px; }
  h1 { font-size: 1.15rem; }
  .honk { font-size: 1.2rem; padding: 8px 16px; }
  .sound { width: 44px; height: 44px; }
  .stars { font-size: 1.5rem; }
  .stars svg { width: 26px; height: 26px; }
  .avatar { width: 46px; height: 46px; font-size: 27px; }
}
@media (max-width: 400px) { h1 { display: none; } header { justify-content: space-between; } }
/* Short screens (phones held sideways): slim top bar so the board gets the height. */
@media (max-height: 500px) {
  header { padding-block: 4px; gap: 8px; }
  h1 { font-size: 1.15rem; }
  .avatar { width: 40px; height: 40px; font-size: 24px; }
  .stars { font-size: 1.3rem; padding: 2px 12px 2px 8px; }
  .stars svg { width: 22px; height: 22px; }
  .sound, .home { width: 40px; height: 40px; }
  .sound svg, .home svg { width: 22px; height: 22px; }
  .honk { font-size: 1.1rem; padding: 6px 14px; }
}
/* On small screens the hint floats over the top road instead of covering the bottom row of buildings. */
@media (max-width: 560px), (max-height: 500px) {
  .hint { bottom: auto; top: 6px; font-size: 1rem; padding: 4px 14px; border-radius: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .hint, .stars.bump, .avatar.bump, .banner { animation: none; }
}
</style>

<div id="app">
  <header>
    <span id="davidPic" class="avatar" role="img" aria-label="Brandmand">🧑‍🚒</span>
    <div id="stars" class="stars" aria-live="polite" aria-label="Slukkede brande">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="#fff8e6" stroke="#2b2340" stroke-width="2" stroke-linejoin="round"/></svg>
      <span id="starCount">0</span>
    </div>
    <h1>Davids Brandbil</h1>
    <div class="actions">
      <a id="homeBtn" class="home" href="../" aria-label="Til forsiden" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5L12 4l9 7.5" fill="none" stroke="#2b2340" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h5v-5h3v5h5V10" fill="#2b2340"/></svg>
      </a>
      <button id="soundBtn" class="sound" aria-label="Slå lyden fra">
        <svg id="iconOn" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#2b2340"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="#2b2340" stroke-width="2.2" stroke-linecap="round"/></svg>
        <svg id="iconOff" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M4 9h4l5-4v14l-5-4H4z" fill="#2b2340"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" stroke="#2b2340" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
      <button id="honkBtn" class="honk">Dyt!</button>
    </div>
  </header>
  <div id="board">
    <canvas id="city" aria-label="En lille by. Tryk på et hus, der brænder, for at sende brandbilen."></canvas>
    <div id="hint" class="hint">David, tryk på ilden for at sende brandbilen!</div>
    <div id="banner" class="banner" hidden><span class="banner-emoji" aria-hidden="true">🧑‍🚒🚒</span><span id="bannerText">Super-brandmand!</span></div>
  </div>
</div>

<script>
(() => {
  const wrap = document.getElementById('board');
  const cv = document.getElementById('city');
  const ctx = cv.getContext('2d');
  const starBox = document.getElementById('stars');
  const starCount = document.getElementById('starCount');
  const hintEl = document.getElementById('hint');
  const banner = document.getElementById('banner');
  const soundBtn = document.getElementById('soundBtn');
  const davidPic = document.getElementById('davidPic');
  const bannerText = document.getElementById('bannerText');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const INK = '#2b2340';
  const FONT = '"Baloo 2", "Trebuchet MS", sans-serif';
  const WALLS = ['#ffd66b', '#8fd3ff', '#ff9fb2', '#b7a6ff', '#9ee6a8', '#ffb36b'];
  const ROOFS = ['#c2453a', '#3f6fd1', '#7a4fc9', '#d46a2e', '#2f9e6e'];
  const LAYOUT = ['house', 'shop', 'house', 'tower', 'school', 'house', 'station', 'house', 'park', 'house', 'shop', 'tower'];
  const CHEERS = ['Hurra, David!', 'Tak, David!', 'Hurra!', 'Godt klaret, David!', 'Du klarede det!'];
  const BANNERS = ['Super-brandmand David!', 'David redder dagen!', 'Byens helt!', 'Brandchef David!'];
  // things cartoon David says now and then, in a speech bubble (and out loud if there is a Danish voice)
  const SAY = {
    hello: ['Hej! Jeg er klar!', 'Kom, vi passer på byen!'],
    fire: ['Åh nej, ild!', 'Der brænder det!', 'Vi må hjælpe!'],
    go: ['Af sted!', 'Vi kommer!', 'Dyt dyt, flyt jer!'],
    spray: ['Vand på!', 'Sprøjt, sprøjt!', 'Væk med ilden!'],
    saved: ['Ilden er slukket!', 'Det klarede vi!', 'Juhu!'],
    idle: ['Jeg elsker brandbiler!', 'Hvor er ilden?', 'Jeg er klar!', 'Min brandbil er rød!'],
    honk: ['Dyt dyt!', 'Hører I mig?'],
  };
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const SPEED = 4.5; // tiles per second
  const DAVID = 0.55; // David's height in tiles

  let W = 0, H = 0, dpr = 1, cols = 9, rows = 7, tile = 40, ox = 0, oy = 0, landscape = null;
  let buildings = [], station = null, truck = null;
  let parts = [], texts = [];
  let stars = 0, spawnT = 1.5, idleT = 0, time = 0, heldDir = null, bannerT = 0, davidJump = 0, lwScale = 1;
  let speech = null, sayCool = 0, quietT = 6;

  // ---------- city ----------
  function buildCity() {
    cols = landscape ? 9 : 7;
    rows = landscape ? 7 : 9;
    buildings = [];
    let i = 0, shops = 0;
    for (let y = 1; y < rows; y += 2) {
      for (let x = 1; x < cols; x += 2) {
        const kind = LAYOUT[i % LAYOUT.length];
        buildings.push({
          x, y, kind,
          wall: WALLS[i % WALLS.length], roof: ROOFS[i % ROOFS.length],
          label: kind === 'shop' ? (shops++ % 2 ? 'CAFÉ' : 'LEGETØJ') : '',
          burning: false, fire: 0, happy: 0, smokeT: 0,
        });
        i++;
      }
    }
    station = buildings.find(b => b.kind === 'station');
    truck = { x: station.x, y: station.y + 1, path: [], face: 1, target: null, spray: null };
    parts = []; texts = [];
    spawnT = 1.5;
  }
  const isRoad = (x, y) => x >= 0 && y >= 0 && x < cols && y < rows && (x % 2 === 0 || y % 2 === 0);
  const buildingAt = (x, y) => buildings.find(b => b.x === x && b.y === y);
  const canBurn = b => b.kind !== 'park' && b.kind !== 'station';

  function findPath(sx, sy, isGoal) {
    const key = (x, y) => y * cols + x;
    const prev = new Map([[key(sx, sy), -1]]);
    const queue = [[sx, sy]];
    while (queue.length) {
      const [x, y] = queue.shift();
      if (isGoal(x, y)) {
        const path = [];
        let k = key(x, y);
        while (k !== key(sx, sy)) { path.unshift({ x: k % cols, y: Math.floor(k / cols) }); k = prev.get(k); }
        return path;
      }
      for (const [dx, dy] of DIRS) {
        const nx = x + dx, ny = y + dy;
        if (isRoad(nx, ny) && !prev.has(key(nx, ny))) { prev.set(key(nx, ny), key(x, y)); queue.push([nx, ny]); }
      }
    }
    return null;
  }

  function sendTo(x, y) {
    const b = buildingAt(x, y);
    if (!b && !isRoad(x, y)) return;
    const moving = truck.path.length > 0;
    const from = moving ? truck.path[0] : { x: truck.x, y: truck.y };
    const isGoal = b ? (gx, gy) => Math.abs(gx - b.x) + Math.abs(gy - b.y) === 1 : (gx, gy) => gx === x && gy === y;
    const p = findPath(from.x, from.y, isGoal);
    if (!p) return;
    truck.path = moving ? [truck.path[0], ...p] : p;
    truck.target = b || null;
    if (b && b.burning && p.length) say('go', 0.5);
    if (b && !b.burning && !p.length) honk();
  }

  // ---------- game events ----------
  function ignite(b) {
    b.burning = true; b.fire = 0.4;
    texts.push({ text: 'Hjælp!', x: b.x + 0.5, y: b.y - 0.05, life: 1.4, max: 1.4, color: '#e8352b' });
    beep(300, 0.35, { type: 'triangle', vol: 0.08, to: 620 });
    say('fire', 0.6);
  }

  function save(b) {
    b.burning = false; b.fire = 0; b.happy = 3; davidJump = 1.2;
    stars++;
    starCount.textContent = stars;
    for (const el of [starBox, davidPic]) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
    hintEl.hidden = true;
    texts.push({ text: CHEERS[Math.random() * CHEERS.length | 0], x: b.x + 0.5, y: b.y + 0.2, life: 1.8, max: 1.8, color: '#2f9e6e' });
    for (let i = 0; i < 18; i++) {
      const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * 2;
      parts.push({ kind: 'spark', x: b.x + 0.5, y: b.y + 0.5, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, g: 3, life: 0.9, max: 0.9 });
    }
    [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.28, { type: 'triangle', vol: 0.16, delay: i * 0.09 }));
    if (!buildings.some(o => o.burning)) spawnT = Math.min(spawnT, 5);
    if (stars % 5 === 0) celebrate();
    say('saved', 0.7, true);
  }

  // David says a random line of this kind; `chance` keeps him from talking every time
  function say(kind, chance = 1, now = false) {
    if ((sayCool > 0 && !now) || Math.random() > chance) return;
    const lines = SAY[kind];
    const text = lines[Math.random() * lines.length | 0];
    speech = { text, life: 2.8, max: 2.8 };
    sayCool = 5;
    quietT = 0;
    speak(text);
  }

  function celebrate() {
    bannerText.textContent = BANNERS[(stars / 5 - 1) % BANNERS.length];
    banner.hidden = false;
    bannerT = 4.5;
    const colors = ['#e8352b', '#ffc21a', '#3aa0ff', '#2f9e6e', '#b7a6ff', '#ff9fb2'];
    for (let i = 0; i < (reduce ? 30 : 110); i++) {
      parts.push({
        kind: 'confetti', x: Math.random() * cols, y: -0.5 - Math.random() * 2,
        vx: (Math.random() - 0.5) * 1.5, vy: Math.random() * 2, g: 2.5,
        life: 3.5, max: 3.5, color: colors[i % colors.length], rot: Math.random() * 6, spin: (Math.random() - 0.5) * 12,
      });
    }
    [523, 523, 659, 784].forEach((f, i) => beep(f, i === 3 ? 0.6 : 0.16, { type: 'square', vol: 0.07, delay: 0.5 + i * 0.14 }));
  }

  function honk() {
    ensureAudio();
    beep(330, 0.4, { type: 'square', vol: 0.08 });
    beep(415, 0.4, { type: 'square', vol: 0.06 });
    texts.push({ text: 'DYT!', x: truck.x + 0.5, y: truck.y - 0.1, life: 1, max: 1, color: '#e8352b' });
    say('honk', 0.3);
  }

  // ---------- update ----------
  function update(dt) {
    time += dt;
    const burning = buildings.filter(b => b.burning);

    spawnT -= dt;
    if (spawnT <= 0) {
      if (burning.length < 2) {
        const choices = buildings.filter(b => canBurn(b) && !b.burning && b.happy <= 0);
        if (choices.length) ignite(choices[Math.random() * choices.length | 0]);
      }
      spawnT = 12 + Math.random() * 6;
    }

    // drive
    if (truck.path.length) {
      const n = truck.path[0];
      const dx = n.x - truck.x, dy = n.y - truck.y, d = Math.hypot(dx, dy), step = SPEED * dt;
      if (dx) truck.face = Math.sign(dx);
      if (d <= step) { truck.x = n.x; truck.y = n.y; truck.path.shift(); }
      else { truck.x += dx / d * step; truck.y += dy / d * step; }
    } else if (heldDir) {
      const nx = truck.x + heldDir[0], ny = truck.y + heldDir[1];
      if (isRoad(nx, ny)) { truck.path.push({ x: nx, y: ny }); truck.target = null; }
    }

    // spray any burning building next to a parked truck
    const wasSpraying = truck.spray;
    truck.spray = null;
    if (!truck.path.length) {
      const near = b => b.burning && Math.abs(b.x - truck.x) <= 1 && Math.abs(b.y - truck.y) <= 1;
      const b = truck.target && near(truck.target) ? truck.target : buildings.find(near);
      if (b) {
        if (wasSpraying !== b) say('spray', 0.5);
        truck.spray = b;
        if (b.x !== truck.x) truck.face = Math.sign(b.x - truck.x);
        b.fire -= dt * 0.45;
        for (let i = 0; i < 2; i++) spawnDrop(b);
        if (b.fire <= 0) save(b);
      }
    }

    for (const b of buildings) {
      if (b.burning) {
        if (truck.spray !== b) b.fire = Math.min(1, b.fire + dt * 0.06);
        b.smokeT -= dt;
        if (b.smokeT <= 0) {
          b.smokeT = 0.22;
          parts.push({ kind: 'smoke', x: b.x + 0.4 + Math.random() * 0.2, y: b.y + 0.25, vx: 0.1 + Math.random() * 0.15, vy: -0.55, g: 0, life: 1.8, max: 1.8 });
        }
      }
      if (b.happy > 0) {
        b.happy -= dt;
        if (Math.random() < dt * 4) {
          parts.push({ kind: 'heart', x: b.x + 0.3 + Math.random() * 0.4, y: b.y + 0.4, vx: (Math.random() - 0.5) * 0.3, vy: -0.7, g: 0, life: 1.3, max: 1.3 });
        }
      }
    }

    for (const p of parts) {
      p.life -= dt; p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.spin) p.rot += p.spin * dt;
      if (p.kind === 'drop' && p.life <= 0) {
        for (let i = 0; i < 2; i++) parts.push({ kind: 'splash', x: p.x, y: p.y, vx: (Math.random() - 0.5) * 1.6, vy: -Math.random() * 1.4, g: 6, life: 0.3, max: 0.3 });
      }
    }
    parts = parts.filter(p => p.life > 0);
    for (const t of texts) { t.life -= dt; t.y -= dt * 0.5; }
    texts = texts.filter(t => t.life > 0);

    idleT = buildings.some(b => b.burning) && !truck.path.length && !truck.spray ? idleT + dt : 0;

    if (davidJump > 0) davidJump -= dt;
    if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) banner.hidden = true; }

    if (sayCool > 0) sayCool -= dt;
    if (speech) { speech.life -= dt; if (speech.life <= 0) speech = null; }
    const calm = !truck.path.length && !buildings.some(b => b.burning);
    quietT = calm ? quietT + dt : 0;
    if (quietT > 9) { quietT = 0; say(stars ? 'idle' : 'hello', 0.6); }

    setSiren(truck.path.length > 0 && buildings.some(b => b.burning));
    setHiss(!!truck.spray);
  }

  // David hops out and stands beside the truck whenever it is parked
  const davidSpot = () => ({ x: truck.x + 0.5 + truck.face * 0.32, y: truck.y + 0.84 });
  function nozzle() {
    const d = davidSpot();
    return { x: d.x + truck.face * DAVID * 0.42, y: d.y - DAVID * 0.53 };
  }

  function spawnDrop(b) {
    const n = nozzle(), sx = n.x, sy = n.y;
    const tx = b.x + 0.5 + (Math.random() - 0.5) * 0.3, ty = b.y + 0.5 + (Math.random() - 0.5) * 0.15;
    const ft = 0.38 + Math.random() * 0.12, g = 7;
    parts.push({ kind: 'drop', x: sx, y: sy, vx: (tx - sx) / ft, vy: (ty - sy) / ft - 0.5 * g * ft, g, life: ft, max: ft });
  }

  // ---------- drawing helpers ----------
  const X = tx => ox + tx * tile;
  const Y = ty => oy + ty * tile;
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function outline() { ctx.lineWidth = Math.max(1.5 * lwScale, tile * 0.022 * lwScale); ctx.lineJoin = 'round'; ctx.strokeStyle = INK; ctx.stroke(); }
  function box(x, y, w, h, fill, r = 0) {
    if (r) rr(x, y, w, h, r); else { ctx.beginPath(); ctx.rect(x, y, w, h); }
    ctx.fillStyle = fill; ctx.fill(); outline();
  }
  function poly(pts, fill) {
    ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); outline();
  }
  function win(b, x, y, w, h) {
    const lit = b.burning ? (Math.sin(time * 14 + x) > 0 ? '#ff8a1c' : '#ffb03a') : '#fff3b0';
    box(x, y, w, h, lit);
    ctx.beginPath(); ctx.moveTo(x + w / 2, y); ctx.lineTo(x + w / 2, y + h); ctx.moveTo(x, y + h / 2); ctx.lineTo(x + w, y + h / 2);
    ctx.lineWidth = Math.max(1, tile * 0.012); ctx.stroke();
  }
  function circle(x, y, r, fill, stroke = true) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); if (stroke) outline();
  }

  // ---------- draw city ----------
  function drawRoad(x, y) {
    const px = X(x), py = Y(y), s = tile;
    ctx.fillStyle = '#596074';
    ctx.fillRect(px, py, s + 0.5, s + 0.5);
    ctx.fillStyle = '#ffd84a';
    const hz = y % 2 === 0, vt = x % 2 === 0;
    if (hz && !vt) { ctx.fillRect(px + s * 0.12, py + s * 0.48, s * 0.28, s * 0.04); ctx.fillRect(px + s * 0.6, py + s * 0.48, s * 0.28, s * 0.04); }
    if (vt && !hz) { ctx.fillRect(px + s * 0.48, py + s * 0.12, s * 0.04, s * 0.28); ctx.fillRect(px + s * 0.48, py + s * 0.6, s * 0.04, s * 0.28); }
  }

  function drawBuilding(b) {
    const px = X(b.x), py = Y(b.y), s = tile;
    rr(px + s * 0.04, py + s * 0.04, s * 0.92, s * 0.92, s * 0.1); ctx.fillStyle = '#efe6d2'; ctx.fill();
    rr(px + s * 0.09, py + s * 0.09, s * 0.82, s * 0.82, s * 0.08); ctx.fillStyle = '#a5df7f'; ctx.fill();

    if (b.burning) {
      const a = 0.45 + 0.35 * Math.sin(time * 6);
      rr(px + s * 0.05, py + s * 0.05, s * 0.9, s * 0.9, s * 0.1);
      ctx.lineWidth = s * 0.05; ctx.strokeStyle = `rgba(232,53,43,${a})`; ctx.stroke();
    }

    const k = (fx, fy) => [px + fx * s, py + fy * s];
    switch (b.kind) {
      case 'house': {
        box(...k(0.62, 0.2), s * 0.08, s * 0.17, '#a35a44');
        box(...k(0.2, 0.45), s * 0.6, s * 0.43, b.wall);
        poly([...k(0.12, 0.47), ...k(0.5, 0.14), ...k(0.88, 0.47)], b.roof);
        box(...k(0.44, 0.66), s * 0.12, s * 0.22, b.roof, s * 0.02);
        win(b, ...k(0.26, 0.54), s * 0.13, s * 0.13);
        win(b, ...k(0.61, 0.54), s * 0.13, s * 0.13);
        break;
      }
      case 'shop': {
        box(...k(0.15, 0.36), s * 0.7, s * 0.52, b.wall);
        box(...k(0.22, 0.18), s * 0.56, s * 0.15, '#fff8e6', s * 0.03);
        ctx.fillStyle = INK; ctx.font = `800 ${s * 0.12}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(b.label, px + s * 0.5, py + s * 0.262, s * 0.5);
        const sw = s * 0.7 / 6;
        for (let i = 0; i < 6; i++) {
          ctx.fillStyle = i % 2 ? '#fff8e6' : b.roof;
          ctx.beginPath();
          ctx.moveTo(px + s * 0.15 + i * sw, py + s * 0.36);
          ctx.lineTo(px + s * 0.15 + (i + 1) * sw, py + s * 0.36);
          ctx.lineTo(px + s * 0.15 + (i + 1) * sw, py + s * 0.45);
          ctx.arc(px + s * 0.15 + (i + 0.5) * sw, py + s * 0.45, sw / 2, 0, Math.PI);
          ctx.closePath(); ctx.fill(); outline();
        }
        win(b, ...k(0.2, 0.55), s * 0.3, s * 0.2);
        box(...k(0.58, 0.56), s * 0.18, s * 0.32, b.roof, s * 0.02);
        break;
      }
      case 'tower': {
        box(...k(0.24, 0.12), s * 0.52, s * 0.76, b.wall);
        box(...k(0.21, 0.08), s * 0.58, s * 0.07, b.roof);
        for (let r = 0; r < 3; r++) for (let c = 0; c < 2; c++) win(b, ...k(0.31 + c * 0.25, 0.22 + r * 0.17), s * 0.13, s * 0.11);
        box(...k(0.43, 0.74), s * 0.14, s * 0.14, b.roof);
        break;
      }
      case 'school': {
        box(...k(0.42, 0.15), s * 0.16, s * 0.2, '#f2c48d');
        poly([...k(0.38, 0.16), ...k(0.5, 0.05), ...k(0.62, 0.16)], b.roof);
        circle(px + s * 0.5, py + s * 0.25, s * 0.035, '#ffc21a');
        box(...k(0.1, 0.42), s * 0.8, s * 0.46, '#f2c48d');
        poly([...k(0.08, 0.44), ...k(0.5, 0.3), ...k(0.92, 0.44)], b.roof);
        for (const fx of [0.15, 0.3, 0.6, 0.75]) win(b, ...k(fx, 0.52), s * 0.1, s * 0.1);
        box(...k(0.44, 0.66), s * 0.12, s * 0.22, '#3f6fd1', s * 0.02);
        break;
      }
      case 'station': {
        box(...k(0.12, 0.3), s * 0.76, s * 0.58, '#d84a35');
        box(...k(0.12, 0.3), s * 0.76, s * 0.13, INK);
        ctx.fillStyle = '#ffc21a'; ctx.font = `800 ${s * 0.11}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('BRAND', px + s * 0.5, py + s * 0.37, s * 0.7);
        rr(px + s * 0.27, py + s * 0.5, s * 0.46, s * 0.38, s * 0.04); ctx.fillStyle = '#f4ede0'; ctx.fill(); outline();
        ctx.beginPath();
        for (let i = 1; i < 4; i++) { ctx.moveTo(px + s * 0.27, py + s * (0.5 + i * 0.095)); ctx.lineTo(px + s * 0.73, py + s * (0.5 + i * 0.095)); }
        ctx.lineWidth = Math.max(1, s * 0.012); ctx.stroke();
        circle(px + s * 0.5, py + s * 0.26, s * 0.045, Math.sin(time * 6) > 0 ? '#ff4136' : '#fff8e6');
        break;
      }
      case 'park': {
        ctx.beginPath(); ctx.ellipse(px + s * 0.62, py + s * 0.66, s * 0.2, s * 0.12, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#6cc3ff'; ctx.fill(); outline();
        for (const [tx, ty, r] of [[0.3, 0.42, 0.16], [0.7, 0.3, 0.13]]) {
          box(px + s * (tx - 0.03), py + s * ty, s * 0.06, s * 0.2, '#8a5a3c');
          circle(px + s * tx, py + s * ty, s * r, '#3fae55');
        }
        for (const [fx, fy, c] of [[0.2, 0.78, '#ff9fb2'], [0.3, 0.84, '#ffd66b'], [0.4, 0.76, '#ffffff']]) circle(px + s * fx, py + s * fy, s * 0.03, c, false);
        break;
      }
    }
    if (b.burning) drawFire(b, px, py, s);
  }

  function flame(cx, base, w, h, color) {
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, base);
    ctx.quadraticCurveTo(cx - w * 0.6, base - h * 0.55, cx, base - h);
    ctx.quadraticCurveTo(cx + w * 0.6, base - h * 0.55, cx + w / 2, base);
    ctx.arc(cx, base, w / 2, 0, Math.PI);
    ctx.fillStyle = color; ctx.fill();
  }
  function drawFire(b, px, py, s) {
    const f = Math.max(0, b.fire), base = py + s * 0.62, cx = px + s * 0.5;
    const glow = ctx.createRadialGradient(cx, base - s * 0.15, 0, cx, base - s * 0.15, s * 0.65);
    glow.addColorStop(0, `rgba(255,160,40,${0.5 * f})`);
    glow.addColorStop(1, 'rgba(255,160,40,0)');
    ctx.fillStyle = glow; ctx.fillRect(px - s * 0.2, py - s * 0.2, s * 1.4, s * 1.4);
    const n = 5;
    for (let i = 0; i < n; i++) {
      const off = (i - (n - 1) / 2) * s * 0.13 + Math.sin(time * 5 + i * 2.3) * s * 0.015;
      const h = s * (0.25 + 0.35 * f) * (0.78 + 0.22 * Math.sin(time * 9 + i * 1.7)) * (i === 2 ? 1.2 : i % 2 ? 0.95 : 0.75);
      const w = s * 0.15 * (0.6 + f * 0.5);
      flame(cx + off, base, w, h, '#e8352b');
      flame(cx + off, base, w * 0.7, h * 0.72, '#ff8a1c');
      flame(cx + off, base, w * 0.4, h * 0.45, '#ffd84a');
    }
  }

  function drawTruck() {
    const s = tile * 0.95;
    const moving = truck.path.length > 0;
    const bob = moving && !reduce ? Math.sin(time * 22) * tile * 0.012 : 0;
    const cx = X(truck.x + 0.5), cy = Y(truck.y + 0.5) + bob;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(truck.face, 1);
    ctx.beginPath(); ctx.ellipse(0, s * 0.27, s * 0.46, s * 0.06, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fill();

    box(-s * 0.46, -s * 0.12, s * 0.64, s * 0.3, '#e8352b', s * 0.04);
    box(-s * 0.4, -s * 0.07, s * 0.16, s * 0.12, '#ff6a5e', s * 0.02);
    box(-s * 0.2, -s * 0.07, s * 0.16, s * 0.12, '#ff6a5e', s * 0.02);
    ctx.fillStyle = '#fff8e6'; ctx.fillRect(-s * 0.46, s * 0.08, s * 0.92, s * 0.035);
    poly([s * 0.16, -s * 0.21, s * 0.33, -s * 0.21, s * 0.46, -s * 0.05, s * 0.46, s * 0.18, s * 0.16, s * 0.18], '#e8352b');
    poly([s * 0.21, -s * 0.17, s * 0.31, -s * 0.17, s * 0.41, -s * 0.05, s * 0.21, -s * 0.05], '#bfe9ff');
    if (moving) { lwScale = 0.5; drawDavidHead(s * 0.29, -s * 0.085, s * 0.042); lwScale = 1; }
    ctx.fillStyle = '#fff8e6'; ctx.fillRect(s * 0.16, s * 0.08, s * 0.3, s * 0.035);

    // ladder
    box(-s * 0.44, -s * 0.21, s * 0.56, s * 0.06, '#d7dbe3');
    ctx.beginPath();
    for (let i = 1; i < 7; i++) { ctx.moveTo(-s * 0.44 + i * s * 0.08, -s * 0.21); ctx.lineTo(-s * 0.44 + i * s * 0.08, -s * 0.15); }
    ctx.lineWidth = Math.max(1, s * 0.015); ctx.stroke();

    // light bar
    const flash = (moving || truck.spray) && Math.floor(time * 8) % 2;
    box(s * 0.2, -s * 0.27, s * 0.05, s * 0.06, flash ? '#3aa0ff' : '#ff4136', s * 0.01);
    box(s * 0.25, -s * 0.27, s * 0.05, s * 0.06, flash ? '#ff4136' : '#3aa0ff', s * 0.01);

    // wheels
    for (const wx of [-s * 0.3, s * 0.3]) {
      circle(wx, s * 0.18, s * 0.095, '#2b2340');
      circle(wx, s * 0.18, s * 0.04, '#c9ced8', false);
    }
    box(s * 0.44, s * 0.1, s * 0.05, s * 0.07, '#c9ced8', s * 0.01);
    ctx.restore();
  }

  function drawDavidHead(cx, cy, r) {
    circle(cx, cy + r * 0.05, r * 1.05, '#e8c46a');
    circle(cx, cy + r * 0.12, r * 0.92, '#f6d2b8');
    circle(cx - r * 0.5, cy + r * 0.4, r * 0.17, 'rgba(255,120,120,0.45)', false);
    circle(cx + r * 0.5, cy + r * 0.4, r * 0.17, 'rgba(255,120,120,0.45)', false);
    circle(cx - r * 0.33, cy + r * 0.12, r * 0.1, INK, false);
    circle(cx + r * 0.33, cy + r * 0.12, r * 0.1, INK, false);
    ctx.beginPath(); ctx.arc(cx, cy + r * 0.3, r * 0.3, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.lineWidth = Math.max(1, r * 0.12); ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.stroke();
    // red fire helmet with the black badge
    ctx.beginPath(); ctx.ellipse(cx, cy - r * 0.3, r * 1.55, r * 0.32, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#e8352b'; ctx.fill(); outline();
    ctx.beginPath(); ctx.arc(cx, cy - r * 0.35, r * 0.95, Math.PI, 0); ctx.closePath();
    ctx.fillStyle = '#e8352b'; ctx.fill(); outline();
    circle(cx, cy - r * 0.8, r * 0.26, INK, false);
    circle(cx, cy - r * 0.8, r * 0.12, '#ffc21a', false);
  }

  function limb(x1, y1, x2, y2, w) {
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.strokeStyle = INK; ctx.lineWidth = w + Math.max(2, tile * 0.03); ctx.stroke();
    ctx.strokeStyle = '#e8352b'; ctx.lineWidth = w; ctx.stroke();
    circle(x2, y2, w * 0.55, '#f6d2b8', false);
  }

  function drawDavid() {
    if (truck.path.length) return; // he rides in the cab while driving
    const u = tile * DAVID, f = truck.face, d = davidSpot();
    const jump = davidJump > 0 && !reduce ? Math.abs(Math.sin(davidJump * 8)) * tile * 0.12 : 0;
    const fx = X(d.x), fy = Y(d.y) - jump;
    const spraying = !!truck.spray;
    const waving = davidJump > 0 || (!spraying && Math.sin(time * 1.3) > 0.6);

    if (spraying) {
      ctx.beginPath();
      ctx.moveTo(X(truck.x + 0.5 - f * 0.2), Y(truck.y + 0.6));
      ctx.quadraticCurveTo(X(d.x - f * 0.1), Y(d.y + 0.05), fx + f * u * 0.25, fy - u * 0.5);
      ctx.lineCap = 'round';
      ctx.strokeStyle = INK; ctx.lineWidth = u * 0.11; ctx.stroke();
      ctx.strokeStyle = '#ffd84a'; ctx.lineWidth = u * 0.06; ctx.stroke();
    }

    ctx.beginPath(); ctx.ellipse(fx, Y(d.y), u * 0.2, u * 0.05, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fill();

    // legs with reflective stripes and blue socks
    for (const sx of [-1, 1]) {
      box(fx + sx * 0.075 * u - 0.055 * u, fy - 0.34 * u, 0.11 * u, 0.28 * u, '#e8352b');
      ctx.fillStyle = '#e9f53a'; ctx.fillRect(fx + sx * 0.075 * u - 0.055 * u, fy - 0.17 * u, 0.11 * u, 0.04 * u);
      box(fx + sx * 0.08 * u - 0.07 * u, fy - 0.08 * u, 0.14 * u, 0.08 * u, '#4aa3d8', 0.03 * u);
    }

    // jacket
    box(fx - 0.17 * u, fy - 0.66 * u, 0.34 * u, 0.36 * u, '#e8352b', 0.06 * u);
    ctx.fillStyle = '#e9f53a';
    ctx.fillRect(fx - 0.17 * u, fy - 0.57 * u, 0.34 * u, 0.045 * u);
    ctx.fillRect(fx - 0.17 * u, fy - 0.45 * u, 0.34 * u, 0.045 * u);
    ctx.fillStyle = INK; ctx.fillRect(fx - 0.17 * u, fy - 0.37 * u, 0.34 * u, 0.03 * u);
    poly([fx - 0.08 * u, fy - 0.66 * u, fx + 0.08 * u, fy - 0.66 * u, fx, fy - 0.6 * u], INK);

    // grey blankie tucked into his belt
    for (const [bx, by, br] of [[-0.13, -0.36, 0.07], [-0.07, -0.3, 0.06], [-0.15, -0.27, 0.055]]) {
      circle(fx + f * bx * u, fy + by * u, br * u, '#cfd0d6');
    }

    const sh = fy - 0.6 * u;
    if (spraying) {
      limb(fx - 0.12 * u, sh, fx + f * 0.25 * u, fy - 0.5 * u, 0.08 * u);
      limb(fx + 0.12 * u, sh, fx + f * 0.3 * u, fy - 0.52 * u, 0.08 * u);
      ctx.beginPath(); ctx.moveTo(fx + f * 0.25 * u, fy - 0.5 * u); ctx.lineTo(fx + f * 0.42 * u, fy - 0.53 * u);
      ctx.strokeStyle = INK; ctx.lineWidth = u * 0.09; ctx.stroke();
      ctx.strokeStyle = '#c9ced8'; ctx.lineWidth = u * 0.05; ctx.stroke();
    } else {
      limb(fx - 0.14 * u, sh, fx - 0.22 * u, fy - 0.38 * u, 0.08 * u);
      if (waving) limb(fx + 0.14 * u, sh, fx + 0.24 * u + Math.sin(time * 10) * 0.08 * u, fy - 0.92 * u, 0.08 * u);
      else limb(fx + 0.14 * u, sh, fx + 0.22 * u, fy - 0.38 * u, 0.08 * u);
    }

    drawDavidHead(fx, fy - 0.8 * u, 0.15 * u);
  }

  function heart(x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x, y + r * 0.9);
    ctx.bezierCurveTo(x - r * 1.3, y + r * 0.1, x - r * 0.7, y - r, x, y - r * 0.35);
    ctx.bezierCurveTo(x + r * 0.7, y - r, x + r * 1.3, y + r * 0.1, x, y + r * 0.9);
    ctx.fill();
  }

  function drawParticles() {
    for (const p of parts) {
      const x = X(p.x), y = Y(p.y), a = Math.max(0, p.life / p.max);
      switch (p.kind) {
        case 'drop': circle(x, y, tile * 0.045, '#3aa0ff', false); circle(x - tile * 0.012, y - tile * 0.012, tile * 0.015, '#d6efff', false); break;
        case 'splash': ctx.globalAlpha = a; circle(x, y, tile * 0.03, '#7cc4ff', false); ctx.globalAlpha = 1; break;
        case 'smoke': ctx.globalAlpha = 0.4 * a; circle(x, y, tile * (0.1 + (1 - a) * 0.22), '#7a7a88', false); ctx.globalAlpha = 1; break;
        case 'spark': ctx.globalAlpha = a; circle(x, y, tile * 0.04, '#ffc21a', false); ctx.globalAlpha = 1; break;
        case 'heart': ctx.globalAlpha = a; ctx.fillStyle = '#ff5c8a'; heart(x, y, tile * 0.08); ctx.globalAlpha = 1; break;
        case 'confetti':
          ctx.save(); ctx.globalAlpha = Math.min(1, a * 2); ctx.translate(x, y); ctx.rotate(p.rot);
          ctx.fillStyle = p.color; ctx.fillRect(-tile * 0.05, -tile * 0.025, tile * 0.1, tile * 0.05); ctx.restore();
          break;
      }
    }
  }

  function drawTexts() {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const t of texts) {
      const age = 1 - t.life / t.max;
      const scale = age < 0.15 ? age / 0.15 : 1;
      ctx.globalAlpha = Math.min(1, t.life / 0.4);
      ctx.font = `800 ${tile * 0.32 * scale}px ${FONT}`;
      ctx.lineWidth = tile * 0.08; ctx.strokeStyle = '#ffffff'; ctx.lineJoin = 'round';
      ctx.strokeText(t.text, X(t.x), Y(t.y));
      ctx.fillStyle = t.color; ctx.fillText(t.text, X(t.x), Y(t.y));
    }
    ctx.globalAlpha = 1;
  }

  // speech bubble over David's head (over the cab while he drives); flips below him near the top edge
  function drawSpeech() {
    if (!speech) return;
    const d = davidSpot(), moving = truck.path.length > 0;
    const ax = moving ? X(truck.x + 0.5 + truck.face * 0.28) : X(d.x);
    const top = moving ? Y(truck.y + 0.5) - tile * 0.3 : Y(d.y) - tile * DAVID * 1.08;
    const fs = Math.max(14, tile * 0.24);
    ctx.font = `800 ${fs}px ${FONT}`;
    const w = ctx.measureText(speech.text).width + fs * 1.2, h = fs * 1.7, tail = fs * 0.7;
    const above = top - tail - h >= 4;
    const ay = above ? top : (moving ? Y(truck.y + 0.5) + tile * 0.3 : Y(d.y) + tile * 0.06);
    const by = above ? ay - tail - h : ay + tail;
    const bx = Math.min(Math.max(ax - w / 2, 4), W - w - 4);
    const edge = above ? by + h : by;
    const tx = Math.min(Math.max(ax - tail * 0.45, bx + h * 0.4), bx + w - h * 0.4 - tail * 0.9);
    const age = 1 - speech.life / speech.max;
    const sc = reduce ? 1 : Math.min(1, 0.4 + age / 0.06 * 0.6);
    ctx.save();
    ctx.globalAlpha = Math.min(1, speech.life / 0.3);
    ctx.translate(ax, ay); ctx.scale(sc, sc); ctx.translate(-ax, -ay);
    poly([tx, edge, tx + tail * 0.9, edge, ax, ay], '#ffffff');
    box(bx, by, w, h, '#ffffff', h * 0.45);
    // hide the bubble's border where the tail joins it
    const lw = ctx.lineWidth, dir = above ? -1 : 1;
    ctx.beginPath(); ctx.moveTo(tx + lw, edge + dir * lw); ctx.lineTo(tx + tail * 0.9 - lw, edge + dir * lw); ctx.lineTo(ax, ay + dir * lw * 2.5);
    ctx.closePath(); ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(speech.text, bx + w / 2, by + h / 2 + fs * 0.06);
    ctx.restore();
  }

  function drawPointer() {
    if (idleT < 2.5) return;
    let best = null, bd = Infinity;
    for (const b of buildings) if (b.burning) { const d = Math.abs(b.x - truck.x) + Math.abs(b.y - truck.y); if (d < bd) { bd = d; best = b; } }
    if (!best) return;
    const s = tile, cx = X(best.x + 0.5);
    const top = Y(best.y) - s * 0.02 - (reduce ? 0 : Math.abs(Math.sin(time * 5)) * s * 0.15);
    poly([cx - s * 0.1, top - s * 0.34, cx + s * 0.1, top - s * 0.34, cx + s * 0.1, top - s * 0.17, cx + s * 0.2, top - s * 0.17, cx, top + s * 0.04, cx - s * 0.2, top - s * 0.17, cx - s * 0.1, top - s * 0.17], '#ffc21a');
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#8fd16a';
    ctx.fillRect(0, 0, W, H);
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) if (isRoad(x, y)) drawRoad(x, y);
    for (const b of buildings) drawBuilding(b);
    drawTruck();
    drawDavid();
    drawParticles();
    drawTexts();
    drawPointer();
    drawSpeech();
  }

  // ---------- sound ----------
  let ac = null, master = null, muted = false, siren = null, hiss = null, noiseBuf = null;
  function ensureAudio() {
    if (!ac) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      try { ac = new C(); } catch (e) { return null; }
      master = ac.createGain();
      master.gain.value = muted ? 0 : 0.8;
      master.connect(ac.destination);
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function beep(freq, dur, { type = 'sine', vol = 0.2, delay = 0, to = null } = {}) {
    if (!ac) return;
    const t0 = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  // David's voice: only with a Danish system voice, since other voices mangle Danish words
  const synth = window.speechSynthesis;
  let daVoice = null;
  function pickVoice() {
    const voices = synth.getVoices();
    daVoice = voices.find(v => /^da[-_]?/i.test(v.lang) && v.localService) || voices.find(v => /^da/i.test(v.lang)) || null;
  }
  if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
  function speak(text) {
    if (!synth || !daVoice || muted) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.voice = daVoice; u.lang = daVoice.lang;
    u.pitch = 1.6; u.rate = 1.05;
    synth.speak(u);
  }
  function setSiren(on) {
    if (!ac) return;
    if (on && !siren) {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle';
      g.gain.value = 0; g.gain.setTargetAtTime(0.06, ac.currentTime, 0.05);
      o.connect(g).connect(master); o.start();
      siren = { o, g };
    } else if (!on && siren) {
      siren.g.gain.setTargetAtTime(0, ac.currentTime, 0.05);
      siren.o.stop(ac.currentTime + 0.4);
      siren = null;
    }
    if (siren) siren.o.frequency.setTargetAtTime(Math.floor(time * 2.5) % 2 ? 880 : 660, ac.currentTime, 0.02);
  }
  function setHiss(on) {
    if (!ac) return;
    if (on && !hiss) {
      if (!noiseBuf) {
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      const src = ac.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = 0.7;
      const g = ac.createGain(); g.gain.value = 0; g.gain.setTargetAtTime(0.1, ac.currentTime, 0.05);
      src.connect(f).connect(g).connect(master); src.start();
      hiss = { src, g };
    } else if (!on && hiss) {
      hiss.g.gain.setTargetAtTime(0, ac.currentTime, 0.05);
      hiss.src.stop(ac.currentTime + 0.4);
      hiss = null;
    }
  }

  // ---------- input ----------
  cv.addEventListener('pointerdown', e => {
    ensureAudio();
    const r = cv.getBoundingClientRect();
    const tx = Math.floor((e.clientX - r.left - ox) / tile), ty = Math.floor((e.clientY - r.top - oy) / tile);
    if (tx < 0 || ty < 0 || tx >= cols || ty >= rows) return;
    if (!truck.path.length && tx === truck.x && ty === truck.y) { honk(); return; }
    sendTo(tx, ty);
  });
  document.getElementById('honkBtn').addEventListener('click', honk);
  soundBtn.addEventListener('click', () => {
    ensureAudio();
    muted = !muted;
    if (master) master.gain.setTargetAtTime(muted ? 0 : 0.8, ac.currentTime, 0.02);
    if (muted && synth) synth.cancel();
    document.getElementById('iconOn').hidden = muted;
    document.getElementById('iconOff').hidden = !muted;
    soundBtn.setAttribute('aria-label', muted ? 'Slå lyden til' : 'Slå lyden fra');
  });
  const KEYS = { arrowup: [0, -1], arrowdown: [0, 1], arrowleft: [-1, 0], arrowright: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] };
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (KEYS[k]) {
      e.preventDefault(); ensureAudio();
      heldDir = KEYS[k];
      truck.path = truck.path.slice(0, 1);
      truck.target = null;
    } else if (k === ' ' && e.target === document.body) { e.preventDefault(); honk(); }
  });
  window.addEventListener('keyup', e => { if (KEYS[e.key.toLowerCase()] === heldDir) heldDir = null; });

  // ---------- loop ----------
  function resize() {
    const r = wrap.getBoundingClientRect();
    W = r.width; H = r.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const land = W >= H;
    if (land !== landscape) { landscape = land; buildCity(); }
    const pad = Math.min(W, H) * 0.02; // keep the outer roads off the screen edge
    tile = Math.min((W - 2 * pad) / cols, (H - 2 * pad) / rows);
    ox = (W - cols * tile) / 2; oy = (H - rows * tile) / 2;
  }
  let last = 0;
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  function start(data) {
    stars = +(data && data.stars) || 0;
    starCount.textContent = stars;
    if (stars > 0) hintEl.hidden = true;
    resize();
    texts.push({ text: 'Hej David!', x: truck.x + 0.5, y: truck.y - 0.2, life: 3, max: 3, color: '#e8352b' });
    new ResizeObserver(resize).observe(wrap);
    if (window.visualViewport) visualViewport.addEventListener('resize', resize); // phone toolbars and rotation
    requestAnimationFrame(loop);
  }
  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ stars }));
  if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
})();
</script>

<script>
// The house button leads back to the game menu, but only on the games site (not inside a claude.ai preview).
if (/\/(firetruck|lorry)\/(index\.html)?$/.test(location.pathname)) document.getElementById('homeBtn').hidden = false;
</script>
